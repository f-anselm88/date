<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for you</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f3;--card:#ffffff;--ink:#4a1d2c;--soft:#8c5a69;--pink:#f4768f;--pink-d:#d9506c;--mint:#e9e3ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3a2030;--ink:#ffe8ee;--soft:#d9a9b8;--mint:#4a3a6a}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.card{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 12px 40px rgba(217,80,108,.18);position:relative}
.screen{display:none;animation:in .35s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.pic{width:112px;height:112px;border-radius:26px;margin:0 auto 18px;display:grid;place-items:center;font-size:56px;background:var(--mint);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 10px;font-weight:600}
p{margin:0 0 18px;color:var(--soft);line-height:1.5}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px;margin-top:8px}
button{font:inherit;font-weight:500;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;color:#fff;background:var(--pink);transition:transform .15s,background .15s}
button:hover{background:var(--pink-d)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px}
#yes{font-size:calc(1rem * var(--grow,1))}
#no{background:var(--mint);color:var(--ink);transition:left .25s ease,top .25s ease,transform .15s}
#no.fly{position:fixed;z-index:10}
label{display:block;text-align:left;font-size:.9rem;color:var(--soft);margin:12px 0 6px}
input,select{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--mint);background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 6px}
.food{background:var(--bg);color:var(--ink);border:2px solid var(--mint);border-radius:18px;padding:16px 8px;font-size:1rem}
.food span{display:block;font-size:2rem;margin-bottom:4px}
.food:hover,.food.sel{background:var(--mint);border-color:var(--pink)}
.note{font-size:.85rem;font-style:italic}
.full{width:100%;margin-top:18px}
.bit{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bit{display:none}#no{transition:none}}
</style>
</head>
<body>
<main class="card">

  <!-- 1. The question -->
  <section class="screen on" id="s1">
    <div class="pic" id="pic1">🌸</div>
    <h1 id="q"></h1>
    <p id="sub"></p>
    <div class="row"><button id="yes">Yes 💖</button><button id="no" type="button">No</button></div>
  </section>

  <!-- 2. Celebration -->
  <section class="screen" id="s2">
    <div class="pic">🎉</div>
    <h1>You said yes!!</h1>
    <p>Okay, I'm officially the happiest person right now.</p>
    <button class="full" data-go="s3">Okay, next</button>
  </section>

  <!-- 3. Day and time -->
  <section class="screen" id="s3">
    <div class="pic">📅</div>
    <h1>So… when are you free?</h1>
    <label for="day">Pick a day</label>
    <input type="date" id="day">
    <label for="time">What time?</label>
    <select id="time"></select>
    <button class="full" id="setDate">Set the date</button>
  </section>

  <!-- 4. Food -->
  <section class="screen" id="s4">
    <div class="pic">🍽️</div>
    <h1>What are we feeling?</h1>
    <div class="grid" id="foods"></div>
    <button class="full" id="foodNext" disabled style="opacity:.5">Choose one first</button>
  </section>

  <!-- 5. Final message -->
  <section class="screen" id="s5">
    <div class="pic" id="pic5">💌</div>
    <h1 id="final"></h1>
    <p id="summary"></p>
    <p class="note" id="ps"></p>
  </section>
</main>

<script>
/* ====== EDIT THESE ====== */
const CONFIG = {
  herName: "Beautiful",
  yourName: "Me",
  question: "Will you go on a date with me?",
  subtitle: "Choose carefully 😌",
  finalMessage: "I'm so glad you said yes. Be ready, I'm coming to get you 🚗",
  ps: "P.S. I built this website just for you.",
  photo: "" // paste a photo link or data: image here, or leave empty for an emoji
};
// Free key from https://web3forms.com (enter your email there, they send the key to your inbox)
const WEB3_KEY = "703c7581-4f32-4859-a109-fabe72c2fe15";
const FOODS = [["🍕","Pizza"],["🍣","Sushi"],["🍔","Burgers"],["🍝","Pasta"],["🌮","Tacos"],["🍜","Ramen"]];
const TIMES = ["12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];
/* ======================== */

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); };
const choice = {};

$('q').textContent = CONFIG.question;
$('sub').textContent = CONFIG.subtitle;
if (CONFIG.photo) ['pic1','pic5'].forEach(id => { $(id).innerHTML = '<img alt="" src="' + CONFIG.photo + '">'; });

/* Dodging "No" button */
const no = $('no'), yes = $('yes');
const noText = ["No","Are you sure?","Really?","Think again","Don't do this","Pretty please","Nope 🙈","Try Yes!"];
let dodges = 0;
function dodge(e){
  if (e) e.preventDefault();
  dodges++;
  no.classList.add('fly');
  const w = no.offsetWidth, h = no.offsetHeight, m = 12;
  const x = m + Math.random() * (window.innerWidth - w - m * 2);
  const y = m + Math.random() * (window.innerHeight - h - m * 2);
  no.style.left = x + 'px'; no.style.top = y + 'px';
  no.textContent = noText[Math.min(dodges, noText.length - 1)];
  yes.style.setProperty('--grow', Math.min(1 + dodges * 0.12, 1.9));
}
['pointerenter','touchstart','pointerdown','focus'].forEach(ev => no.addEventListener(ev, dodge, {passive:false}));
no.addEventListener('click', e => e.preventDefault()); // "No" can never be chosen

/* Email notifications (Web3Forms) */
function notify(subject, message, fields){
  if (!WEB3_KEY || WEB3_KEY.startsWith('PASTE')) return;
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Accept':'application/json'},
    body: JSON.stringify(Object.assign(
      {access_key: WEB3_KEY, subject: subject, from_name: 'Date proposal page', message: message},
      fields || {}
    ))
  }).catch(() => {});
}
notify('She opened the page 👀', 'She just opened your date proposal page.');

/* Yes */
yes.addEventListener('click', () => {
  no.style.display = 'none'; show('s2'); burst();
  notify('She said YES 💖', 'She clicked Yes after trying to press No ' + dodges + ' time(s).',
    {Answer: 'Yes', 'No attempts': String(dodges)});
});
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));

/* Day and time */
const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
$('day').min = today.toISOString().slice(0,10);
$('time').innerHTML = '<option value="">Select a time…</option>' + TIMES.map(t => '<option>' + t + '</option>').join('');
$('setDate').addEventListener('click', () => {
  if (!$('day').value || !$('time').value) { alert('Please pick both a day and a time 💕'); return; }
  choice.day = new Date($('day').value + 'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  choice.time = $('time').value;
  show('s4');
});

/* Food */
const fg = $('foods');
FOODS.forEach(([e,n]) => {
  const b = document.createElement('button');
  b.className = 'food'; b.innerHTML = '<span>' + e + '</span>' + n;
  b.addEventListener('click', () => {
    fg.querySelectorAll('.food').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); choice.food = n;
    const nx = $('foodNext'); nx.disabled = false; nx.style.opacity = 1; nx.textContent = 'Lock it in';
  });
  fg.appendChild(b);
});
$('foodNext').addEventListener('click', () => {
  $('final').textContent = CONFIG.finalMessage;
  $('summary').textContent = choice.day + ' at ' + choice.time + ' · ' + choice.food;
  $('ps').textContent = CONFIG.ps;
  show('s5'); burst();
  notify('Date is set 🎉', 'Day: ' + choice.day + '\nTime: ' + choice.time + '\nFood: ' + choice.food,
    {Day: choice.day, Time: choice.time, Food: choice.food, Answer: 'Yes'});
});

/* Confetti */
function burst(){
  const set = ['💖','🌸','✨','💕','🎉'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'bit'; s.textContent = set[i % set.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }
}
</script>
</body>
</html>
